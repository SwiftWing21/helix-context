# Local-only template: telemetry APIs have no authentication. Keep every
# published port on loopback; see README.md before exposing this stack.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: cymatix-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC — what cymatix's FastAPI points at
      - "127.0.0.1:4318:4318"   # OTLP HTTP (reserved for future clients like Celestia)
      - "127.0.0.1:8889:8889"   # Prometheus scrape endpoint
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cymatix-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=14d"
      - "--storage.tsdb.retention.size=4GB"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    container_name: cymatix-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # Tempo query API
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    container_name: cymatix-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: cymatix-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # The admin fallback is for loopback-only local setup. Override on first
      # boot; an existing Grafana volume keeps its previously configured password.
      - GF_SECURITY_ADMIN_PASSWORD=${CYMATIX_GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=${CYMATIX_GRAFANA_ANON:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
