[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cymatix_context"]

[tool.hatch.build.targets.sdist]
# Bench receipts and research data are repo artifacts, not package sources
# (the wheel above never carried them). Without this exclude they grew the
# sdist from 7.87 MB (0.9.1) to 13.27 MB on the 0.9.2 integration branch.
exclude = [
    "/benchmarks",
    "/docs/research/data",
]

[project]
name = "cymatix-context"
version = "0.9.2"
description = "Coordinate index layer for LLM context — Cymatix weighs, doesn't retrieve"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Michael Bachaud", email = "swiftwing21@users.noreply.github.com" },
]
keywords = ["llm", "context", "compression", "retrieval", "cymatics", "rag", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "filelock>=3.12",
    # Frontmatter parsing for the OKF adapter (cymatix_context/okf/). Also
    # fixes a latent packaging bug: vault/writer.py and vault/pruner.py
    # have imported yaml unconditionally since the vault shipped, but no
    # dependency list declared it.
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mbachaud/Cymatix-Context"
Repository = "https://github.com/mbachaud/Cymatix-Context"
Issues = "https://github.com/mbachaud/Cymatix-Context/issues"

[project.optional-dependencies]
# Every extra below is gated on a feature cymatix exposes at runtime. Core
# (`pip install cymatix-context`) gives a working HTTP server + /context
# + /context/packet with genome-local retrieval. Add extras as you turn
# on specific features.
accel = ["orjson>=3.9"]
embeddings = ["numpy", "sentence-transformers"]
# spacy floor tracks the en_core_web_sm pipeline build the docs and setup
# script install (3.8.0, see docs/SETUP.md). The pipeline itself is a
# separate artifact that pip never pulls in (#313).
cpu = ["spacy>=3.8"]
# MCP SDK — required for `python -m cymatix_context.mcp_server` (Claude Code,
# Codex, Gemini CLI, and Antigravity integration). Core install does NOT pull
# this; add the extra if you are an MCP host operator.
mcp = ["mcp>=2,<3"]
# NLI / DeBERTa cross-encoder backends — only needed when
# `[ribosome] backend = "deberta"` or relation-graph NLI is enabled.
# `embeddings` already transitively pulls torch via sentence-transformers,
# so this is just the standalone path.
nli = ["torch>=2.0", "transformers>=4.30"]
# OpenTelemetry observability — traces + metrics + logs via OTLP gRPC.
# Required only when `CYMATIX_OTEL_ENABLED=1`; core cymatix runs without them.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
launcher = ["jinja2>=3.1", "psutil>=5.9", "platformdirs>=4.0", "py-cpuinfo>=9.0"]
launcher-native = [
    "jinja2>=3.1", "psutil>=5.9", "platformdirs>=4.0", "py-cpuinfo>=9.0",
    "pywebview>=5.0",
]
# pystray is LGPL-3. It is a runtime-only optional dep that the user
# installs explicitly; the cymatix-context wheel itself does not bundle
# pystray, so the core package stays Apache-2.0-clean.
launcher-tray = [
    "jinja2>=3.1", "psutil>=5.9", "platformdirs>=4.0", "py-cpuinfo>=9.0",
    "pystray>=0.19", "Pillow>=10",
    "pywin32>=306; sys_platform == 'win32'",
]
ast = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]
scorerift = ["scorerift"]
# CPU-resident semantic compression for gene content. Headroom by Tejas Chopra
# (https://github.com/chopratejas/headroom, Apache-2.0). See NOTICE.
codec = ["headroom-ai[proxy,code]>=0.5.21"]
dev = [
    "pytest",
    "pytest-asyncio",
    "numpy",
    "spacy>=3.8",
    "hypothesis>=6.0",
    "markdown>=3.4",  # scripts/build_wiki_site.py + its tests
    "rank-bm25>=0.2.2",  # offline RepoBench baseline tests
    "httpx2>=2.0.0",  # Starlette TestClient's supported HTTP client
]
# `all` covers the full feature surface minus contributor-only extras
# (dev) and the LGPL launcher-tray variant. Dep bulk dominated by
# sentence-transformers + torch + spacy + tree-sitter + headroom-ai.
all = [
    "orjson>=3.9",
    "numpy",
    "sentence-transformers",
    "spacy>=3.8",
    "mcp>=2,<3",
    "torch>=2.0",
    "transformers>=4.30",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "jinja2>=3.1",
    "psutil>=5.9",
    "platformdirs>=4.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "headroom-ai[proxy,code]>=0.5.21",
]

[project.scripts]
cymatix = "cymatix_context.cli:main"
cymatix-server = "cymatix_context.server:main"
cymatix-launcher = "cymatix_context.launcher.app:main"
cymatix-status = "cymatix_context.cli.cymatix_status:main"
cymatix-vault = "cymatix_context.vault.cli:main"

[tool.ruff.lint]
# Errors-and-undefined-names only (matches the CI lint job): syntax
# errors (E9), invalid comparisons (F63), logic errors (F7), undefined
# names (F82). Not a style gate.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires Ollama running with at least one model",
    "requires_rocm: opt-in test that needs ROCm-capable hardware (gated by CYMATIX_TEST_ROCM=1)",
    "requires_real_cuda: opt-in test that needs real CUDA hardware (gated by CYMATIX_TEST_CUDA=1)",
    "requires_mps: test that runs only on macOS with MPS-capable hardware",
    "slow: end-to-end test that loads SPLADE / spaCy and takes 10+ seconds",
    "concurrency: multi-thread/process correctness test (liveness + no torn writes; never asserts absolute latency)",
    "perf: dev-box perf measurement; excluded from default CI runs (receipts + ratio gates live in benchmarks/dogfood)",
]
