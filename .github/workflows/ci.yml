name: CI

# Branch model (docs/RELEASING.md): master holds released code only, beta is
# the integration branch and default PR base, release/vX.Y.Z is cut from beta,
# hotfix/* is cut from master. The same jobs run on every push to master, beta
# and release/**, and on every pull request whose base is master or beta. A
# hotfix/* branch is exercised by its PR to master, so it is not listed under
# push; a release/** branch runs on push because its PR to master is opened
# after the tree is already final. The release-source job at the bottom is the
# source-branch guard for master; it is scoped by a job-level `if` and skips on
# every event that is not a PR against master.
on:
  push:
    branches: [master, beta, "release/**"]
  pull_request:
    branches: [master, beta]

# Cancel in-progress runs on the same ref so a fast follow-up push
# doesn't keep a stale run alive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast fail-early gate: syntax errors + undefined names only (E9/F63/
  # F7/F82). Deliberately NOT a style linter — rule selection is pinned
  # in [tool.ruff.lint] in pyproject.toml so local `ruff check .` and CI
  # agree.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (errors + undefined names only)
        run: ruff check --select E9,F63,F7,F82 .

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install package + test deps
        run: pip install -e ".[dev]" psutil platformdirs py-cpuinfo numpy joblib scikit-learn

      # Platform hardware coverage; the full offline suite runs below.
      - name: Run hardware test suite
        run: pytest tests/test_hardware.py tests/test_hardware_real_device.py tests/test_hardware_mps_smoke.py -v

  # Targeted suites for the symbol-graph feature cover
  # extraction, pipeline, lifecycle cleanup, flag-off routing, write-lock
  # integrity, and the config/reference-sync contract. The [ast] extra
  # installs tree-sitter (+ grammars) so the skipif-marked symbol tests
  # actually run rather than degrade to skips.
  test-symbol-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install package + test deps + tree-sitter extra
        run: pip install -e ".[dev,ast]" psutil platformdirs py-cpuinfo numpy joblib scikit-learn

      - name: Install spaCy model (ingest-path tests exercise the CPU tagger)
        run: python -m spacy download en_core_web_sm

      - name: Run symbol-graph test suites
        run: >
          pytest
          tests/test_symbol_extraction.py
          tests/test_symbol_pagerank.py
          tests/test_symbol_graph_pipeline.py
          tests/test_symbol_graph_lifecycle.py
          tests/test_symbol_graph_flag_off.py
          tests/test_config.py
          tests/test_config_reference_sync.py
          tests/test_store_write_integrity.py
          -v

  # Full offline suite (v0.8.0 release-audit follow-up). The historical
  # blocker — server.py's module-level `app = create_app()` import side
  # effect — is gone: the eager app now lives only in _asgi.py, which
  # tests never import. This job exists because file-scoped selection let
  # real drift slide (the ShardedGenomeAdapter parity gap shipped unseen
  # for weeks). Required test dependencies are checked explicitly; optional
  # hardware/model coverage still reports skips.
  test-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      # The [nli] extra (transformers) un-skips the fully-mocked
      # transformers-gated tests (incl. the #341 rerank device-routing
      # test); torch is already the CPU wheel from the step above, so no
      # CUDA wheel gets pulled in.
      - name: Install package + test deps + tree-sitter, MCP and NLI extras
        run: pip install -e ".[dev,ast,mcp,nli]" psutil platformdirs py-cpuinfo numpy joblib scikit-learn

      - name: Verify installed test dependencies cannot silently skip coverage
        run: |
          python - <<'PY'
          from importlib import import_module
          modules = (
              "markdown", "rank_bm25", "httpx2", "mcp.server.mcpserver",
              "tree_sitter", "tree_sitter_python", "tree_sitter_rust",
              "tree_sitter_javascript", "tree_sitter_typescript", "transformers",
          )
          for name in modules:
              import_module(name)
              print(f"required test dependency available: {name}")
          PY
          python -m pip check

      # issue #313 regression gate: at this point in the job the spaCy
      # pipeline is not installed yet, which is exactly the fresh-install
      # state the issue describes. The suite must pass with the ingest-path
      # tests skipping cleanly (reasons printed via -rs name the fix). The
      # assert keeps the leg honest if a future dependency ever starts
      # pulling the pipeline in transitively. The focused test runs before
      # the suite, because the suite only proves those tests skip -- it
      # never checks what the fresh-install user is actually told. The
      # download step below then restores the full-coverage run.
      - name: Assert the spaCy pipeline is absent (fresh-install state)
        run: |
          python - <<'PY'
          import sys
          import spacy.util
          if spacy.util.is_package("en_core_web_sm"):
              sys.exit("en_core_web_sm already installed; modelless leg would prove nothing")
          PY

      - name: Assert the missing-pipeline error itself (issue #313)
        run: pytest tests/test_spacy_pipeline_missing.py -q -rs

      - name: Run full offline suite WITHOUT the spaCy pipeline (fresh-install gate, issue #313)
        run: pytest tests/ -m "not live" -q -rs

      - name: Install spaCy model (ingest-path tests exercise the CPU tagger)
        run: python -m spacy download en_core_web_sm

      - name: Run full offline suite
        run: pytest tests/ -m "not live" -q -rs

  test-macos-mps:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test deps + transformers (for MPS smoke test)
        run: pip install -e ".[dev]" torch transformers psutil platformdirs py-cpuinfo numpy joblib scikit-learn

      # The MPS smoke test is the integration check this platform job adds.
      #
      # PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.0 disables PyTorch's internal MPS
      # memory ceiling. On the GHA macos-14 runner the default ceiling is
      # too tight and trips on tiny allocations even when ~7 GiB is free.
      # This is the documented workaround
      # (https://pytorch.org/docs/stable/notes/mps.html).
      - name: Run hardware test suite (MPS smoke test runs only on this job)
        env:
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
        run: pytest tests/test_hardware.py tests/test_hardware_real_device.py tests/test_hardware_mps_smoke.py -v

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install package + test deps
        run: pip install -e ".[dev]" psutil platformdirs py-cpuinfo numpy joblib scikit-learn

      # Exercise Windows executable discovery as well as platform hardware.
      - name: Run hardware and Windows invocation tests
        run: >
          pytest tests/test_hardware.py tests/test_hardware_real_device.py
          tests/test_hardware_mps_smoke.py tests/test_install_observability.py
          tests/test_cli_dispatcher.py -v -rs

  # Only release/** and hotfix/** heads may merge to master (docs/RELEASING.md
  # section 1). GitHub cannot express a head-branch condition in branch
  # protection or in a ruleset, so the guard is this status check, required on
  # master. The job-level `if` scopes it to pull requests whose base is master:
  # on a push to beta or release/**, and on a PR targeting beta, the job is
  # skipped and the other five jobs are unaffected.
  release-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Head branch must be release/** or hotfix/**
        run: |
          case "${{ github.head_ref }}" in
            release/*|hotfix/*) echo "ok: ${{ github.head_ref }}" ;;
            *) echo "PRs to master must come from release/** or hotfix/**; retarget this PR to beta (docs/RELEASING.md)"; exit 1 ;;
          esac
